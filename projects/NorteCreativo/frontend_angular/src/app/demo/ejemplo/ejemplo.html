<section class="max-w-xl rounded-lg border border-slate-200 bg-white p-5 shadow-sm" aria-label="Ejemplo de signals">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 class="text-lg font-semibold">{{ entregable().nombre }}</h2>
    <p-tag
      [value]="entregable().estado"
      [severity]="entregable().estado === 'ENTREGADO' ? 'success' : 'info'"
    />
  </div>

  <dl class="mt-4 grid grid-cols-2 gap-3 text-sm">
    <div>
      <dt class="text-slate-500">Total</dt>
      <dd class="text-xl font-semibold">$ {{ entregable().total | number: '1.0-0' }}</dd>
    </div>
    <div>
      <dt class="text-slate-500">Total con IVA 19 %</dt>
      <dd class="text-xl font-semibold">$ {{ totalConIva() | number: '1.0-0' }}</dd>
    </div>
  </dl>

  <div class="mt-5 flex flex-wrap gap-2">
    <p-button label="- 100.000" severity="secondary" (onClick)="cambiarTotal(-paso)" />
    <p-button label="+ 100.000" (onClick)="cambiarTotal(paso)" />
    <p-button label="Cambiar estado" severity="info" (onClick)="alternarEstado()" />
    <p-button label="Cambiar nombre" severity="help" (onClick)="cambiarNombre()" />
    <p-button label="Reiniciar" severity="danger" [outlined]="true" (onClick)="reiniciar()" />
  </div>
</section>
