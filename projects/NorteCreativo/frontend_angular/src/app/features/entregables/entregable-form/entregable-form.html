<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
  <div class="flex flex-col gap-1">
    <label for="entregable-tarea" class="font-medium">Tarea</label>
    <p-select
      inputId="entregable-tarea"
      formControlName="tarea_id"
      [options]="tareasActivas()"
      optionLabel="etiqueta"
      optionValue="id"
      [filter]="true"
      filterBy="etiqueta"
      placeholder="Selecciona una tarea"
      emptyMessage="No hay tareas activas"
      emptyFilterMessage="Ninguna tarea coincide"
      styleClass="w-full"
    />
    @if (invalid('tarea_id')) {
      <p-message severity="error" size="small" variant="simple">Elige una tarea.</p-message>
    }
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div class="flex flex-col gap-1">
      <label for="entregable-inicio" class="font-medium">Fecha de inicio</label>
      <p-datepicker inputId="entregable-inicio" formControlName="fecha_inicio" dateFormat="dd/mm/yy" [showIcon]="true" [showButtonBar]="true" styleClass="w-full" />
    </div>
    <div class="flex flex-col gap-1">
      <label for="entregable-fin" class="font-medium">Fecha de fin</label>
      <p-datepicker inputId="entregable-fin" formControlName="fecha_fin" dateFormat="dd/mm/yy" [showIcon]="true" [showButtonBar]="true" styleClass="w-full" />
      @if (rangoInvalido) {
        <p-message severity="error" size="small" variant="simple">La fecha de fin no puede ser anterior a la de inicio.</p-message>
      }
    </div>
  </div>

  <div class="grid gap-4 sm:grid-cols-2">
    <div class="flex flex-col gap-1">
      <label for="entregable-total" class="font-medium">Total</label>
      <p-inputnumber inputId="entregable-total" formControlName="total" mode="currency" currency="COP" locale="es-CO" [maxFractionDigits]="0" styleClass="w-full" />
      @if (invalid('total', 'min')) {
        <p-message severity="error" size="small" variant="simple">El total no puede ser negativo.</p-message>
      }
    </div>
    <div class="flex flex-col gap-1">
      <label for="entregable-estado" class="font-medium">Estado</label>
      <p-select inputId="entregable-estado" formControlName="estado" [options]="estados" optionLabel="label" optionValue="value" styleClass="w-full" />
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <label for="entregable-observaciones" class="font-medium">Observaciones <span class="text-slate-500">(opcional)</span></label>
    <textarea pTextarea id="entregable-observaciones" formControlName="observaciones" rows="3"></textarea>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" type="button" (onClick)="cancelled.emit()" />
    <p-button label="Guardar" type="submit" icon="pi pi-check" [loading]="saving()" />
  </div>
</form>
