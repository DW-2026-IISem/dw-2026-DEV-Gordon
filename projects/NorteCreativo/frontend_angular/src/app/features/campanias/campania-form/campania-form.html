<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
  <div class="flex flex-col gap-1">
    <label for="campania-cliente" class="font-medium">Cliente</label>
    <p-select
      inputId="campania-cliente"
      formControlName="cliente_id"
      [options]="clientesActivos()"
      optionLabel="nombre"
      optionValue="id"
      [filter]="true"
      filterBy="nombre"
      placeholder="Selecciona un cliente"
      emptyMessage="No hay clientes activos"
      emptyFilterMessage="Ningún cliente coincide"
      styleClass="w-full"
    />
    @if (invalid('cliente_id')) {
      <p-message severity="error" size="small" variant="simple">Elige un cliente.</p-message>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="campania-nombre" class="font-medium">Nombre</label>
    <input pInputText id="campania-nombre" formControlName="nombre" autocomplete="off" />
    @if (invalid('nombre', 'required')) {
      <p-message severity="error" size="small" variant="simple"
        >El nombre es obligatorio.</p-message
      >
    }
    @if (invalid('nombre', 'maxlength')) {
      <p-message severity="error" size="small" variant="simple"
        >El nombre no puede superar 120 caracteres.</p-message
      >
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="campania-descripcion" class="font-medium"
      >Descripción <span class="text-slate-500">(opcional)</span></label
    >
    <textarea pTextarea id="campania-descripcion" formControlName="descripcion" rows="3"></textarea>
  </div>

  <div class="flex justify-end gap-2">
    <p-button
      label="Cancelar"
      severity="secondary"
      [outlined]="true"
      type="button"
      (onClick)="cancelled.emit()"
    />
    <p-button label="Guardar" type="submit" icon="pi pi-check" [loading]="saving()" />
  </div>
</form>
