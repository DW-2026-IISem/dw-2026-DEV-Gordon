<app-page-header
  title="Mi sesión"
  subtitle="Tu usuario, tus roles y lo que puedes hacer en el sistema."
>
  <div class="flex gap-2">
    <p-button
      label="Actualizar permisos"
      icon="pi pi-refresh"
      severity="secondary"
      [outlined]="true"
      [loading]="refreshing()"
      (onClick)="actualizar()"
    />
    <p-button
      label="Cerrar sesión"
      icon="pi pi-sign-out"
      severity="danger"
      (onClick)="cerrarSesion()"
    />
  </div>
</app-page-header>

@if (session.usuario(); as usuario) {
  <section
    class="mb-6 grid gap-4 rounded-lg border border-slate-200 p-4 sm:grid-cols-3"
    aria-label="Datos del usuario"
  >
    <div>
      <p class="text-sm text-slate-500">Usuario</p>
      <p class="font-medium" data-testid="username">{{ usuario.username }}</p>
    </div>
    <div>
      <p class="text-sm text-slate-500">Correo</p>
      <p class="font-medium">{{ usuario.email }}</p>
    </div>
    <div>
      <p class="text-sm text-slate-500">Roles</p>
      <div class="flex flex-wrap gap-1" data-testid="roles">
        @for (rol of usuario.roles; track rol.id) {
          <p-tag [value]="rol.name" severity="info" />
        }
      </div>
    </div>
  </section>
}

<h2 class="mb-3 text-xl font-semibold">
  Permisos efectivos (<span data-testid="permisos-total">{{ session.permissionCount() }}</span
  >)
</h2>

<p-iconfield class="mb-4 block max-w-md">
  <p-inputicon class="pi pi-search" />
  <input
    pInputText
    type="search"
    class="w-full"
    placeholder="Buscar por método, ruta o rol"
    aria-label="Buscar permisos"
    [value]="filter()"
    (input)="onFilter($event)"
  />
</p-iconfield>

<p-table
  [value]="visiblePermisos()"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [tableStyle]="{ 'min-width': '40rem' }"
>
  <ng-template #header>
    <tr>
      <th>Método</th>
      <th>Ruta</th>
      <th>Roles que lo conceden</th>
    </tr>
  </ng-template>
  <ng-template #body let-permiso>
    <tr>
      <td><p-tag [value]="permiso.method" severity="secondary" /></td>
      <td>
        <code>{{ permiso.path }}</code>
      </td>
      <td>{{ permiso.roles.join(', ') }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="3">
        <app-empty-state
          icon="pi pi-search"
          title="Sin coincidencias"
          message="Ningún permiso coincide con la búsqueda."
        />
      </td>
    </tr>
  </ng-template>
</p-table>
