<main class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <section class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="login-titulo">
    <h1 id="login-titulo" class="mb-1 text-2xl font-bold">Norte Creativo</h1>
    <p class="mb-6 text-slate-600">Inicia sesión para continuar.</p>

    @if (error(); as message) {
      <p-message severity="error" class="mb-4 block">{{ message }}</p-message>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
      <div class="flex flex-col gap-1">
        <label for="login-identifier" class="font-medium">Usuario o correo</label>
        <input pInputText id="login-identifier" formControlName="identifier" autocomplete="username" />
        @if (invalid('identifier')) {
          <p-message severity="error" size="small" variant="simple">Escribe tu usuario o correo.</p-message>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label for="login-password" class="font-medium">Contraseña</label>
        <p-password
          inputId="login-password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (invalid('password')) {
          <p-message severity="error" size="small" variant="simple">Escribe tu contraseña.</p-message>
        }
      </div>

      <p-button type="submit" label="Entrar" icon="pi pi-sign-in" [loading]="loading()" styleClass="w-full" />
    </form>
  </section>
</main>
