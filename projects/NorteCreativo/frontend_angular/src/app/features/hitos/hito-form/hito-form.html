<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
  <div class="flex flex-col gap-1">
    <label for="hito-campania" class="font-medium">Campaña</label>
    <p-select
      inputId="hito-campania"
      formControlName="campania_id"
      [options]="campaniasActivas()"
      optionLabel="nombre"
      optionValue="id"
      [filter]="true"
      filterBy="nombre"
      placeholder="Selecciona una campaña"
      emptyMessage="No hay campañas activas"
      emptyFilterMessage="Ninguna campaña coincide"
      styleClass="w-full"
    />
    @if (invalid('campania_id')) {
      <p-message severity="error" size="small" variant="simple">Elige una campaña.</p-message>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="hito-nombre" class="font-medium">Nombre</label>
    <input pInputText id="hito-nombre" formControlName="nombre" autocomplete="off" />
    @if (invalid('nombre', 'required')) {
      <p-message severity="error" size="small" variant="simple">El nombre es obligatorio.</p-message>
    }
    @if (invalid('nombre', 'maxlength')) {
      <p-message severity="error" size="small" variant="simple">El nombre no puede superar 120 caracteres.</p-message>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="hito-descripcion" class="font-medium">Descripción <span class="text-slate-500">(opcional)</span></label>
    <textarea pTextarea id="hito-descripcion" formControlName="descripcion" rows="3"></textarea>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" type="button" (onClick)="cancelled.emit()" />
    <p-button label="Guardar" type="submit" icon="pi pi-check" [loading]="saving()" />
  </div>
</form>
