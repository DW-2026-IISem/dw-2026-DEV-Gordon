<div class="flex min-h-screen flex-col">
  <app-header (menuRequested)="onMenuRequested()" />

  <div class="flex flex-1">
    @if (!sidebarCollapsed()) {
      <app-aside class="hidden lg:block" [items]="items" (navigated)="onNavigated($event)" />
    }

    <main id="contenido" class="min-w-0 flex-1 p-6">
      <h1 class="text-2xl font-semibold">{{ title() }}</h1>
      <p class="mt-2 text-slate-600">Sección en construcción.</p>
    </main>
  </div>

  <app-footer />
</div>

<p-drawer [(visible)]="mobileOpen" header="Norte Creativo" position="left">
  <app-aside [items]="items" (navigated)="onNavigated($event)" />
</p-drawer>
