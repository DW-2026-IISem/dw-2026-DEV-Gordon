<div
  class="flex flex-col items-center gap-2 rounded-lg border border-dashed border-slate-300 px-6 py-10 text-center"
>
  <i [class]="icon() + ' text-3xl text-slate-400'" aria-hidden="true"></i>
  <p class="text-lg font-medium">{{ title() }}</p>
  @if (message()) {
    <p class="text-slate-600">{{ message() }}</p>
  }
  <div class="mt-2">
    <ng-content />
  </div>
</div>
